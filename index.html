<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Home</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <nav>
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="stocks.html">Stocks</a></li>
      <li><a href="dogs.html">Dogs</a></li>
    </ul>
  </nav>

  <main>
    <h1>Welcome to the Class Activities Site</h1>
    <button class="custom-btn" onclick="location.href='stocks.html'">Stocks</button>
    <button class="custom-btn" onclick="location.href='dogs.html'">Dogs</button>
    <div id="quote"></div>
  </main>

  <div id="audio-controls">
    <h3>Voice Commands</h3>
    <p>Say: "Hello" | "Change the color to blue" | "Navigate to stocks"</p>
    <button onclick="annyang.start()">Turn On Audio</button>
    <button onclick="annyang.abort()">Turn Off Audio</button>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/annyang/2.6.1/annyang.min.js"></script>
  <script>
    if (annyang) {
      const commands = {
        'hello': () => alert('Hello World'),
        'change the color to *color': (color) => {
          document.body.style.backgroundColor = color;
        },
        'navigate to *page': (page) => {
          const destination = page.toLowerCase();
          if (destination.includes('home')) location.href = 'index.html';
          else if (destination.includes('stocks')) location.href = 'stocks.html';
          else if (destination.includes('dogs')) location.href = 'dogs.html';
        }
      };
      annyang.addCommands(commands);
    }

    async function loadQuote() {
      try {
        const response = await fetch('https://zenquotes.io/api/random');
        const data = await response.json();
        document.getElementById('quote').innerText = data[0].q + ' — ' + data[0].a;
      } catch (error) {
        document.getElementById('quote').innerText = 'Quote unavailable.';
      }
    }

    loadQuote();
  </script>
</body>
</html>
